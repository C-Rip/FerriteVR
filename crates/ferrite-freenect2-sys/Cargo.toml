[package]
name = "ferrite-freenect2-sys"
description = "Puente FFI seguro en C++ con libfreenect2 para Kinect v2 en FerriteVR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
non_ascii_idents = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[features]
default = []
kinect = ["dep:cxx"]

[dependencies]
cxx = { version = "1.0", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
