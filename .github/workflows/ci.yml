name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verificar:
    name: Verificación de calidad y consistencia
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configurar caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar utilidades de calidad (typos y cargo-deny)
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-deny

      - name: Ejecutar suite de verificación canónica
        run: ./scripts/verificar.sh

      - name: Comprobación de enlaces en documentación (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-path target --exclude-path .git './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
