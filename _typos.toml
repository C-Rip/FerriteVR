# Configuración de typos para FerriteVR (Proyecto en español)
# Documentación oficial de typos: https://github.com/crate-ci/typos

[files]
# Excluir archivos de documentación y skills en español para evitar falsos positivos
# con el diccionario en inglés de typos, enfocando la revisión en código fuente y scripts.
extend-exclude = [
    "docs/**",
    "*.md",
    ".agents/**",
    "LICENSE-*",
]

[default]
check-filename = true

# Ignorar cadenas con caracteres diacríticos del español
extend-ignore-re = [
    "[áéíóúüñÁÉÍÓÚÜÑ]",
]

